<script>
setInterval(() => {
    const busElements = document.querySelectorAll('.bus');
    const busData = [];

    // 1. 取得目前所有站點的 HTML 內容
    busElements.forEach(el => {
        busData.push(el.innerHTML);
    });

    // 2. 執行順移
    const lastData = busData.pop();
    busData.unshift(lastData);

    // 3. 找出車子現在所在的 index
    let outwardIndex = -1;
    busData.forEach((content, i) => {
        if (content.includes('bus-outward')) {
            outwardIndex = i;
        }
    });

    // 4. 重新渲染，並透過 visibility 控制顯示/隱藏
    busElements.forEach((el, index) => {
        // 先淡出
        el.style.opacity = 0;
        
        setTimeout(() => {
            // 先把內容塞進去（確保內容始終存在於 DOM 中）
            el.innerHTML = busData[index];

            // 判斷邏輯：
            // 如果車子在第一站 (index 0)，全部設為可見
            if (outwardIndex === 0) {
                el.style.visibility = 'visible';
            } else {
                // 如果目前的索引小於車子所在位置，設為隱藏 (但內容還在)
                if (index < outwardIndex) {
                    el.style.visibility = 'hidden';
                } else {
                    el.style.visibility = 'visible';
                }
            }
            
            // 再淡入
            el.style.opacity = 1;
        }, 200); 
    });

}, 2000); 
</script>
